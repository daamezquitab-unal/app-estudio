<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F2EB"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Capas · registro de estudio</title>
<style>
:root{--bg:#F1F2EB;--g:#D8DAD3;--s:#A4C2A5;--m:#566246;--c:#4A4A48}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 Georgia,'Iowan Old Style',serif;background:var(--bg);color:var(--c)}
#app{max-width:480px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px 100px}
h1{font-size:28px;color:var(--m);font-weight:600;letter-spacing:-.5px}
h2{font-size:18px;color:var(--m);margin:20px 0 8px;font-weight:600}
p{margin:6px 0}
button,input,select,textarea{font:15px system-ui,-apple-system,sans-serif;color:inherit}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--g)}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--g);border-radius:12px;background:#fff;margin:4px 0}
textarea{min-height:110px;resize:vertical}
.btn{display:block;background:var(--m);color:#fff;border:0;border-radius:14px;padding:13px 16px;width:100%;font-weight:600;margin-top:8px}
.btn.s{background:var(--s);color:#2f3a25}.btn.g{background:var(--g);color:var(--c)}
.row{display:flex;gap:10px;align-items:center}.row>div{flex:1}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font:12px system-ui,sans-serif;background:var(--g);margin:2px 2px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--g);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:480px;margin:auto}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;opacity:.55}
nav button.on{opacity:1;color:var(--m);font-weight:700}nav b{display:block;font-size:20px;font-weight:400}
.sc{display:flex;gap:6px}.sc button{flex:1;padding:12px 0;border-radius:12px;border:1.5px solid var(--g);background:#fff}.sc button.on{background:var(--m);color:#fff;border-color:var(--m)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font:13px system-ui}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:#fff;position:relative}
.cal .sel{background:var(--m);color:#fff}.cal .has::after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--s)}
.prog{height:6px;background:var(--g);border-radius:9px;margin:10px 0 14px}.prog i{display:block;height:100%;background:var(--s);border-radius:9px;transition:width .3s}
table{width:100%;border-collapse:collapse;font:14px system-ui}td,th{padding:7px 3px;border-top:1px solid var(--g);text-align:left}
summary{cursor:pointer;list-style:none}label{display:block}
.pre{white-space:pre-wrap;margin-top:10px}.x{border:0;background:none;opacity:.5;padding:4px 8px}
</style></head><body>
<div id="app"><div id="v"></div></div>
<nav><div id="nav">
<button data-t="hoy" onclick="go('hoy')"><b>☀</b>Hoy</button>
<button data-t="ses" onclick="go('ses')"><b>✎</b>Sesión</button>
<button data-t="mat" onclick="go('mat')"><b>▤</b>Materias</button>
<button data-t="age" onclick="go('age')"><b>▦</b>Agenda</button>
<button data-t="err" onclick="go('err')"><b>⚑</b>Errores</button>
</div></nav>
<script>
const K='capas.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const D={subs:[
{id:'fm',n:'Fundamentos de matemáticas',c:'#566246',t:'problemas',exam:''},
{id:'cd',n:'Cálculo diferencial',c:'#7d9a78',t:'problemas',exam:''},
{id:'is',n:'Indicadores sociales',c:'#4A4A48',t:'conceptual',exam:''},
{id:'en',n:'Inglés',c:'#A4C2A5',t:'memoria',exam:''},
{id:'as',n:'Introducción a la astronomía',c:'#8a8f6a',t:'conceptual',exam:''}],topics:[],tasks:[],errs:[]};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||D;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=iso(new Date());
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const days=s=>Math.round((new Date(s+'T12:00')-new Date(T+'T12:00'))/864e5);
const fmt=s=>new Date(s+'T12:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
const sub=id=>S.subs.find(x=>x.id==id)||{n:'',c:'#999',t:'conceptual'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TECH={problemas:'Resolver problemas sin repasar antes y llevar registro de errores.',memoria:'Flashcards con recuerdo activo y repetición espaciada.',conceptual:'Explicar con tus palabras, comparar, contrastar y conectar ideas.',procesos:'Reconstruir el procedimiento desde cero y enseñárselo a alguien.'};
const INT={3:[1,3,7,14],2:[2,5,10],1:[3,7]},TL={tarea:'Tarea',mini:'Mini tarea',parcial:'Parcial',plan:'Plan IA'};
const col=s=>s==null?'var(--g)':s<=1?'#e8b4a6':s<=3?'#ecd9a0':'var(--s)';
const lastS=t=>t.scores.length?t.scores[t.scores.length-1].s:null;
let tab='hoy',ses=null,sel=T,cal=new Date(),op='',pst='';
const ERR='No pude conectar con la IA. Revisa que GROQ_API_KEY esté configurada en Netlify y vuelve a desplegar.';
async function ai(u,sy='Eres un tutor de estudio universitario. Responde en español, breve y claro.'){try{const r=await fetch('/.netlify/functions/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:sy},{role:'user',content:u}]})});const d=await r.json();if(!r.ok||!d.text)throw 0;return d.text}catch(e){return null}}
async function run(k,p){ses.d[k]='Pensando…';R();ses.d[k]=(await ai(p))||ERR;R()}
const R=()=>{$('#v').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))};
const go=t=>{tab=t;R();scrollTo(0,0)};
const topicRow=t=>`<div class="card row"><div><b>${esc(t.n)}</b><br><span class=chip style="background:${sub(t.sid).c}33">${sub(t.sid).n}</span></div><button class=btn style="width:auto;margin:0" onclick="start('${t.id}')">${t.first?'Estudiar':'Empezar'}</button></div>`;
const taskRow=t=>t.virt?`<div class=card><b>${esc(t.title)}</b><br><span class=chip>Parcial</span></div>`:`<label class="card row"><input type=checkbox style="width:22px;flex:none" ${t.done?'checked':''} onchange="tog('${t.id}')"><div style="${t.done?'text-decoration:line-through;opacity:.6':''}"><b>${esc(t.title)}</b><br><span class=chip>${TL[t.type]}</span><span class=chip>${sub(t.sid).n}</span><span class=chip>${fmt(t.date)}</span></div><button class=x onclick="event.preventDefault();delT('${t.id}')">✕</button></label>`;
const tog=id=>{const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();R()};
const delT=id=>{S.tasks=S.tasks.filter(x=>x.id!=id);save();R()};
const items=d=>[...S.tasks.filter(t=>t.date==d),...S.subs.filter(s=>s.exam==d).map(s=>({title:'Parcial: '+s.n,date:d,type:'parcial',sid:s.id,virt:1}))];
const subOpts=(v)=>S.subs.map(s=>`<option value=${s.id} ${s.id==v?'selected':''}>${s.n}</option>`).join('');
const V={};
V.hoy=()=>{const ex=S.subs.filter(s=>s.exam&&days(s.exam)>=0).sort((a,b)=>a.exam<b.exam?-1:1),due=S.topics.filter(t=>t.first&&t.next<=T),nw=S.topics.filter(t=>!t.first),tk=S.tasks.filter(t=>!t.done&&t.date<=T);
return `<h1>Hoy</h1><p>${fmt(T)}</p><h2>Parciales</h2>`+(ex.map(s=>`<div class=card style="border-left:6px solid ${s.c}"><b>${s.n}</b><br>${days(s.exam)==0?'Es hoy':'Faltan '+days(s.exam)+' días'} · ${fmt(s.exam)}</div>`).join('')||'<div class=card>Agrega la fecha de tu parcial en Materias para ver la cuenta regresiva.</div>')+'<h2>Capas por pasar</h2>'+(due.map(topicRow).join('')||'<div class=card>No tienes repasos pendientes hoy.</div>')+(nw.length?'<h2>Primer contacto pendiente</h2>'+nw.map(topicRow).join(''):'')+'<h2>Tareas de hoy</h2>'+(tk.map(taskRow).join('')||'<div class=card>Sin tareas para hoy.</div>')};
const STEPS={c:['Calentamiento','Idea general'],r:['Explica con tus palabras','Garabatea','Recuerdo en frío','Aplica','Errores y lagunas','Técnica']};
const ta=(k,ph)=>`<textarea placeholder="${ph}" oninput="ses.d.${k}=this.value">${esc(ses.d[k]||'')}</textarea>`;
const ck=(k,a)=>a.map((x,j)=>`<label class=row style="margin:8px 0"><input type=checkbox style="width:22px;flex:none" ${ses.d[k+j]?'checked':''} onchange="ses.d['${k}${j}']=this.checked">${x}</label>`).join('');
const box=k=>ses.d[k]?`<div class="card pre">${esc(ses.d[k])}</div>`:'';
function start(id){const t=S.topics.find(x=>x.id==id);ses={tid:id,i:0,d:{},m:t.first?'r':'c'};go('ses')}
function body(){const t=S.topics.find(x=>x.id==ses.tid),s=sub(t.sid),k=ses.m+ses.i;
if(k=='c0')return '<p>Hojea el material entre 5 y 10 min sin leer a fondo.</p>'+ck('w',['Títulos y subtítulos','Imágenes, gráficas y tablas','Negritas y definiciones','Ejercicios o preguntas al final'])+ta('g','¿De qué crees que va este tema?');
if(k=='c1')return '<p>Hoy solo lees para tener una idea de lo que verás en clase. No intentes dominarlo: mañana pasas a procesar.</p>'+ta('i','Idea general y dudas para llevar a clase')+'<h2>Mini tarea del profe (opcional)</h2><input placeholder="Ej: ejercicios 1 a 5" value="'+esc(ses.d.mt||'')+'" oninput="ses.d.mt=this.value"><input type=date value="'+(ses.d.md||T)+'" onchange="ses.d.md=this.value">';
if(k=='r0')return '<p>Cierra el material y explica el tema como si se lo contaras a alguien.</p>'+ta('e','Mi explicación…')+`<button class="btn s" onclick="run('fb','Tema: ${esc(t.n)} (${esc(s.n)}). Explicación del estudiante:\\n'+ses.d.e+'\\nSeñala imprecisiones, huecos y 2 preguntas para profundizar.')">Feedback de la IA</button>`+box('fb');
if(k=='r1')return '<p>En una hoja <b>en blanco</b> garabatea palabras clave y flechas. No es un resumen.</p>'+ck('k',['Hoja en blanco lista','Solo palabras clave y conexiones','Sin copiar frases completas'])+ta('kw','Palabras clave (opcional)');
if(k=='r2')return '<p>Sin mirar nada, escribe o di en voz alta todo lo que recuerdes.</p>'+ta('rc','Lo que recuerdo…')+'<p>¿Qué tan bien lo recordaste?</p><div class=sc>'+[0,1,2,3,4,5].map(n=>`<button class="${ses.d.s===n?'on':''}" onclick="ses.d.s=${n};R()">${n}</button>`).join('')+'</div>';
if(k=='r3')return `<p>Resuelve sin repasar antes.</p><button class="btn s" onclick="run('pr','Genera 4 problemas o casos prácticos de dificultad creciente sobre «${esc(t.n)}» para la materia ${esc(s.n)}. Sin soluciones.')">Generar práctica con IA</button>`+box('pr');
if(k=='r4')return '<p>¿Qué falló y por qué?</p><select onchange="ses.d.ca=this.value">'+['No lo entendí','Lo olvidé','Me confundí con otro concepto','Descuido'].map(o=>`<option ${ses.d.ca==o?'selected':''}>${o}</option>`).join('')+'</select>'+ta('et','Describe el error o la laguna')+'<button class="btn s" onclick="addErr()">Guardar en errores</button>'+(ses.d.n?`<p>${ses.d.n} guardado(s) en esta sesión.</p>`:'');
return `<p>Técnica para ${esc(s.n)}:</p><div class=card>${TECH[s.t]}</div><button class="btn s" onclick="run('tc','Sugiere una técnica de estudio distinta a «${s.t}» para el tema «${esc(t.n)}» de ${esc(s.n)}, en 3 líneas.')">Sugerir otra técnica (IA)</button>`+box('tc')}
function addErr(){const t=S.topics.find(x=>x.id==ses.tid);if(!(ses.d.et||'').trim())return;S.errs.push({id:uid(),sid:t.sid,tn:t.n,cause:ses.d.ca||'No lo entendí',text:ses.d.et,fixed:false});ses.d.et='';ses.d.n=(ses.d.n||0)+1;save();R()}
function finish(){const t=S.topics.find(x=>x.id==ses.tid);
if(ses.m=='c'){t.first=T;t.next=add(T,1);if((ses.d.mt||'').trim())S.tasks.push({id:uid(),sid:t.sid,title:ses.d.mt+' ('+t.n+')',date:ses.d.md||T,type:'mini',done:false})}
else{if(ses.d.s==null){alert('Puntúa tu recuerdo en frío en el paso 3.');return}const s=ses.d.s,a=INT[t.dens];t.scores.push({d:T,s});let n=add(T,s<=2?1:a[Math.min(t.scores.length-1,a.length-1)]);const ex=sub(t.sid).exam;if(ex&&n>=ex)n=add(ex,-1);t.next=n<=T?add(T,1):n}
save();ses=null;go('hoy')}
V.ses=()=>{if(!ses)return '<h1>Sesión</h1><p>Elige un tema. Si es nuevo, hoy solo harás el primer contacto.</p>'+(S.topics.map(topicRow).join('')||'<div class=card>Primero crea temas en Materias.</div>');
const st=STEPS[ses.m],n=st.length,t=S.topics.find(x=>x.id==ses.tid);
return `<h1>${ses.m=='c'?'Primer contacto':'Sesión'}</h1><p>${esc(t.n)} · ${sub(t.sid).n}</p><div class=prog><i style="width:${(ses.i+1)/n*100}%"></i></div><h2>${ses.i+1}/${n} · ${st[ses.i]}</h2>`+body()+`<div class=row style="margin-top:14px"><button class="btn g" onclick="${ses.i?'ses.i--;R()':'ses=null;R()'}">${ses.i?'Atrás':'Salir'}</button><button class=btn onclick="${ses.i<n-1?'ses.i++;R();scrollTo(0,0)':'finish()'}">${ses.i<n-1?'Siguiente':'Terminar'}</button></div>`};
V.mat=()=>'<h1>Materias</h1>'+S.subs.map(s=>{const ts=S.topics.filter(t=>t.sid==s.id);return `<details class=card ${op==s.id?'open':''} ontoggle="if(this.open)op='${s.id}'"><summary><b style="color:${s.c}">●</b> <b>${s.n}</b></summary>
<p style="margin-top:10px">Fecha del parcial</p><input type=date value="${s.exam}" onchange="sub('${s.id}').exam=this.value;save()">
<p>Técnica base</p><select onchange="sub('${s.id}').t=this.value;save()">${Object.keys(TECH).map(k=>`<option ${k==s.t?'selected':''}>${k}</option>`).join('')}</select>
${ts.length?`<table><tr><th>Tema</th><th>Recuerdo en frío</th><th>Próxima</th><th></th></tr>${ts.map(t=>`<tr><td>${esc(t.n)}</td><td>${t.scores.slice(-4).map(x=>`<span class=chip style="background:${col(x.s)}">${x.s}</span>`).join('')||'<span class=chip>nuevo</span>'}</td><td>${t.next?fmt(t.next):'—'}</td><td><button class=x onclick="delTopic('${t.id}')">✕</button></td></tr>`).join('')}</table>`:''}
<p style="margin-top:10px">Nuevo tema</p><input id="n${s.id}" placeholder="Nombre del tema"><select id="d${s.id}"><option value=3>Densidad alta</option><option value=2 selected>Densidad media</option><option value=1>Densidad baja</option></select><button class="btn s" onclick="addTopic('${s.id}')">Agregar tema</button></details>`}).join('');
function addTopic(sid){const n=$('#n'+sid).value.trim();if(!n)return;S.topics.push({id:uid(),sid,n,dens:+$('#d'+sid).value,first:'',next:'',scores:[]});save();R()}
function delTopic(id){if(confirm('¿Eliminar este tema?')){S.topics=S.topics.filter(t=>t.id!=id);save();R()}}
V.age=()=>{const y=cal.getFullYear(),m=cal.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),p=x=>String(x).padStart(2,'0');
let c='';for(let i=0;i<off;i++)c+='<div></div>';for(let i=1;i<=dim;i++){const d=`${y}-${p(m+1)}-${p(i)}`;c+=`<button class="${d==sel?'sel':''} ${items(d).length?'has':''}" onclick="sel='${d}';R()">${i}</button>`}
return `<h1>Agenda</h1><div class=row style="justify-content:space-between;margin:10px 0"><button class=x onclick="cal=new Date(${y},${m-1},1);R()">‹</button><b>${cal.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button class=x onclick="cal=new Date(${y},${m+1},1);R()">›</button></div><div class=cal>${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${c}</div>
<h2>${fmt(sel)}</h2>${items(sel).map(taskRow).join('')||'<div class=card>Nada para este día.</div>'}
<div class=card><b>Agregar</b><input id=tt placeholder="Título"><select id=ty><option value=tarea>Tarea</option><option value=mini>Mini tarea del profe</option></select><select id=ts>${subOpts()}</select><input id=td type=date value="${sel}"><button class=btn onclick="addTask()">Guardar</button></div>
<div class=card><b>Plan de estudio con IA</b><p>Genera capas de repaso hasta la fecha del parcial según tus temas y su densidad.</p><select id=ps>${subOpts()}</select><button class="btn s" onclick="genPlan()">Generar plan</button><p>${pst}</p></div>
<h2>Pendientes</h2>${S.tasks.filter(t=>!t.done).sort((a,b)=>a.date<b.date?-1:1).slice(0,12).map(taskRow).join('')||'<div class=card>Todo al día.</div>'}`};
function addTask(){const t=$('#tt').value.trim();if(!t)return;S.tasks.push({id:uid(),sid:$('#ts').value,title:t,date:$('#td').value||sel,type:$('#ty').value,done:false});save();R()}
async function genPlan(){const s=sub($('#ps').value);if(!s.exam||days(s.exam)<1){alert('Define una fecha de parcial futura en Materias.');return}
const ts=S.topics.filter(t=>t.sid==s.id).map(t=>`${t.n} (densidad ${t.dens})`).join('; ')||'sin temas definidos, usa temas generales típicos de la materia';pst='Generando…';R();
const r=await ai(`Hoy es ${T}. Parcial de "${s.n}" el ${s.exam}. Temas: ${ts}. Crea un plan de estudio con capas espaciadas (como pintar una pared: varias manos en diferentes días). Un tema nuevo empieza con un día de solo lectura y primer contacto; luego procesamiento (explicar y garabatear), recuerdo en frío y práctica sin repasar antes; más capas si la densidad es alta; los últimos 2 días para repaso general y errores. Máximo 14 ítems con fechas entre hoy y el día antes del parcial. Responde SOLO un JSON: [{"date":"YYYY-MM-DD","title":"..."}]`,'Eres un planificador de estudio. Respondes únicamente JSON válido.');
try{const a=JSON.parse(r.match(/\[[\s\S]*\]/)[0]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.title);a.forEach(x=>S.tasks.push({id:uid(),sid:s.id,title:x.title,date:x.date,type:'plan',done:false}));save();pst=a.length+' actividades añadidas al calendario.'}catch(e){pst=r?'La IA no devolvió un plan válido. Intenta de nuevo.':ERR}R()}
V.err=()=>{const e=[...S.errs].sort((a,b)=>a.fixed-b.fixed);return '<h1>Errores y lagunas</h1>'+(e.map(x=>`<div class=card style="${x.fixed?'opacity:.6':''}"><span class=chip>${sub(x.sid).n}</span><span class=chip>${x.cause}</span><br><b>${esc(x.tn)}</b><p>${esc(x.text)}</p><div class=row><button class="btn ${x.fixed?'g':'s'}" onclick="fix('${x.id}')">${x.fixed?'Reabrir':'Marcar reforzado'}</button><button class="btn g" style="width:auto" onclick="delE('${x.id}')">✕</button></div></div>`).join('')||'<div class=card>Aún no hay errores registrados. Se guardan desde el paso 5 de una sesión.</div>')};
const fix=id=>{const x=S.errs.find(e=>e.id==id);x.fixed=!x.fixed;save();R()},delE=id=>{S.errs=S.errs.filter(e=>e.id!=id);save();R()};
R();
</script></body></html>
